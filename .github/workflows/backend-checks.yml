name: Backend regression checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6 ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6 ref
        with:
          python-version: '3.12'
      - name: Install CPU runtime and application dependencies
        run: |
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated backend regression suite
        run: python tools/check_backend.py

  customer-journey:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # verified v6 ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # verified v6 ref
        with:
          python-version: '3.12'
      - name: Install test dependencies and browser
        run: |
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; Path('.venv').mkdir(exist_ok=True)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check customer navigation and permission boundaries
        run: python tools/qa_assessments_ui.py
